<div class="cabinet-shell" [class.collapsed]="collapsed()" [class.mobile-open]="mobileOpen()">

  <div class="sidebar-backdrop" (click)="mobileOpen.set(false)"></div>

  <aside class="sidebar">
    <a routerLink="/home" class="brand">
      <div class="logo">E</div>
      <div class="name">
        EduTrack
        <span class="domain">Texnikum #14</span>
      </div>
    </a>

    <div class="nav-section">Asosiy</div>
    @for (item of filteredMenuItems; track item.route) {
      <a [routerLink]="item.route"
         routerLinkActive="active"
         class="nav-item"
         (click)="onNavItemClick()">
        <mat-icon>{{ item.icon }}</mat-icon>
        <span>{{ item.label }}</span>
      </a>
    }

    <div class="sidebar-footer">
      <div class="me-card" [matMenuTriggerFor]="userMenu">
        <div class="et-avatar" [style.background]="userColor()">{{ userInitials() }}</div>
        <div class="who">
          <div class="name">{{ userDisplayName }}</div>
          <div class="role">{{ userRoleDisplay }}</div>
        </div>
        <mat-icon style="color:var(--et-ink-4);font-size:18px;width:18px;height:18px;">expand_more</mat-icon>
      </div>
      <mat-menu #userMenu="matMenu">
        <a mat-menu-item routerLink="/home">
          <mat-icon>home</mat-icon>
          <span>Bosh sahifa</span>
        </a>
        <button mat-menu-item (click)="openLogoutModal()">
          <mat-icon>logout</mat-icon>
          <span>Chiqish</span>
        </button>
      </mat-menu>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <button class="mobile-menu-btn" (click)="mobileOpen.set(true)" aria-label="Menyu">
        <mat-icon>menu</mat-icon>
      </button>

      <div class="search">
        <mat-icon>search</mat-icon>
        <input placeholder="Qidirish: o'quvchi, guruh, fan...">
        <kbd>⌘K</kbd>
      </div>
      <div class="topbar-actions">
        <button class="icon-btn" aria-label="Bildirishnomalar">
          <mat-icon>notifications_none</mat-icon>
          <span class="dot"></span>
        </button>
        <button class="icon-btn" aria-label="Yordam">
          <mat-icon>help_outline</mat-icon>
        </button>
        <button class="icon-btn" aria-label="Tema almashtirish" (click)="toggleTheme()">
          <mat-icon>{{ darkMode() ? 'light_mode' : 'dark_mode' }}</mat-icon>
        </button>
      </div>
    </header>

    <div class="content">
      <router-outlet></router-outlet>
    </div>
  </main>
</div>
