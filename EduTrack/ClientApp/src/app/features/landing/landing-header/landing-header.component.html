<header class="sticky top-0 z-50 bg-white border-b border-gray-100 shadow-sm">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex items-center justify-between h-16">

      <!-- Logo -->
      <a routerLink="/home" class="flex items-center gap-3" style="text-decoration:none">
        <div class="w-10 h-10 bg-indigo-600 rounded-xl flex items-center justify-center flex-shrink-0">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M12 14l9-5-9-5-9 5 9 5zm0 0l6.16-3.422A12.083 12.083 0 0121 15c0 4.97-4.03 9-9 9s-9-4.03-9-9c0-1.07.175-2.1.49-3.06L12 14z"/>
          </svg>
        </div>
        <div class="leading-none">
          <div class="text-lg font-bold text-indigo-700">Texnicum</div>
          <div class="text-xs text-gray-400">Ta'lim boshqaruv tizimi</div>
        </div>
      </a>

      <!-- Desktop Navigation -->
      <nav class="hidden md:flex items-center gap-8">
        <a routerLink="/home" class="text-gray-600 hover:text-indigo-600 font-medium text-sm transition-colors" style="text-decoration:none">
          Bosh sahifa
        </a>
        <a href="#about" class="text-gray-600 hover:text-indigo-600 font-medium text-sm transition-colors" style="text-decoration:none">
          Haqida
        </a>
        <a href="#institutions" class="text-gray-600 hover:text-indigo-600 font-medium text-sm transition-colors" style="text-decoration:none">
          Muassasalar
        </a>
        <a href="#news" class="text-gray-600 hover:text-indigo-600 font-medium text-sm transition-colors" style="text-decoration:none">
          Yangiliklar
        </a>
      </nav>

      <!-- Actions -->
      <div class="flex items-center gap-3">
        <a routerLink="/auth/login"
           class="bg-indigo-600 hover:bg-indigo-700 text-white font-medium text-sm px-5 py-2 rounded-lg transition-colors"
           style="text-decoration:none">
          Kirish
        </a>

        <!-- Mobile toggle -->
        <button
          class="md:hidden p-2 rounded-lg text-gray-600 hover:bg-gray-100 transition-colors border-0 bg-transparent cursor-pointer"
          (click)="toggleMenu()">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            @if (menuOpen()) {
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
            } @else {
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
            }
          </svg>
        </button>
      </div>
    </div>

    <!-- Mobile Navigation -->
    @if (menuOpen()) {
      <div class="md:hidden border-t border-gray-100 py-3 space-y-1">
        <a routerLink="/home" (click)="closeMenu()"
           class="block px-3 py-2 text-gray-600 hover:bg-indigo-50 hover:text-indigo-600 rounded-lg font-medium text-sm transition-colors"
           style="text-decoration:none">Bosh sahifa</a>
        <a href="#about" (click)="closeMenu()"
           class="block px-3 py-2 text-gray-600 hover:bg-indigo-50 hover:text-indigo-600 rounded-lg font-medium text-sm transition-colors"
           style="text-decoration:none">Haqida</a>
        <a href="#institutions" (click)="closeMenu()"
           class="block px-3 py-2 text-gray-600 hover:bg-indigo-50 hover:text-indigo-600 rounded-lg font-medium text-sm transition-colors"
           style="text-decoration:none">Muassasalar</a>
        <a href="#news" (click)="closeMenu()"
           class="block px-3 py-2 text-gray-600 hover:bg-indigo-50 hover:text-indigo-600 rounded-lg font-medium text-sm transition-colors"
           style="text-decoration:none">Yangiliklar</a>
        <div class="pt-2 border-t border-gray-100 mt-2">
          <a routerLink="/auth/login" (click)="closeMenu()"
             class="block px-3 py-2 bg-indigo-600 text-white rounded-lg font-medium text-sm text-center"
             style="text-decoration:none">Kirish</a>
        </div>
      </div>
    }
  </div>
</header>
